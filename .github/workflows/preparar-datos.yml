name: Preparar datos sinteticos originales
on:
  push:
    paths:
      - '.github/workflows/preparar-datos.yml'
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerar CSV originales
        run: |
          python -m pip install pandas==2.2.3 numpy==2.3.5
          cd scripts
          python gen_data.py
      - name: Verificar y almacenar archivos sin crear commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          expected = {
              "clientes.csv": "33fbcf23b678904eeeaa2ccf2d7ccf890c49cd71d6f7bf2c44d91a1fc185ff12",
              "metas.csv": "d94b70c09c5674e0b187bad1116e77c200adf3f95efe2d7a1c9f81ee125afdf1",
              "productos.csv": "6838b9e20f9f3dfd227afa064161f4fa90c47cb35fbc2dd9252c90157cd12de0",
              "raw_ventas.csv": "82634b8d048ef70f68fa1ac5f8bf0e242d9c29d2ad89feffecccb94225ca2d1c"
          }
          for name, digest in expected.items():
              data = (pathlib.Path("scripts") / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, name
              payload = json.dumps({"content": base64.b64encode(data).decode(), "encoding": "base64"}).encode()
              req = urllib.request.Request("https://api.github.com/repos/" + os.environ["REPO"] + "/git/blobs",
                  data=payload, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req) as response:
                  sha = json.load(response)["sha"]
              print("CSV_BLOB", name, sha)
          PY
